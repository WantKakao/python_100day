<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
  <h2>Book Name: {{ book.title }}</h2>
  <h2>Current Rating: {{ book.rating }}</h2>
  <form action="{{ url_for('edit', id=book.id) }}" method="POST">
    <label>Rating</label>
    <input name="rate" placeholder="new rating" type="text" />
    <button type="submit">Change Rating</button>
  </form>
</body>
</html>
